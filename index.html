<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#18a66a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="RoadLog"><link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22RoadLog%22%2C%22short_name%22%3A%22RoadLog%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%230b1116%22%2C%22theme_color%22%3A%22%2318a66a%22%7D">
<title>RoadLog — Vehicle Management</title>
<style>
 :root{color-scheme:dark;--bg:#030d15;--surface:#06131d;--surface2:#091d2a;--text:#f5f8fa;--muted:#8ea7b8;--line:#17415b;--accent:#00e0a0;--accent2:#07875e;--warn:#e0a52f;--danger:#d45858}
*{box-sizing:border-box}body{margin:0;background:#020a10;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}#app{min-height:100vh;background:#020a10}
 .phone{width:min(430px,100%);min-height:100vh;margin:auto;background:linear-gradient(180deg,#07131c 0%,#031019 100%);position:relative;padding-bottom:76px;overflow:hidden}.top{padding:17px 16px 6px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:-.7px;font-size:20px;display:flex;align-items:center;gap:8px;line-height:1}.brand:before{content:'▲';width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#effff9,#0cc78d);color:#062017;display:grid;place-items:center;font-size:19px;clip-path:polygon(50% 0,100% 100%,50% 76%,0 100%)}.brand span{color:var(--accent)}.brand:after{content:'TRACK  •  MANAGE  •  SAVE';position:absolute;margin:25px 0 0 42px;color:#6f8998;font-size:7px;letter-spacing:.08em;font-weight:800}.icon{border:1px solid #23465b;background:#0b2030;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:15px}.screen{padding:7px 16px 24px}.eyebrow{color:#9eb5c3;font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}.title{font-size:30px;line-height:1.02;margin:5px 0 12px;font-weight:900;letter-spacing:-1.5px}.vehicle-card{background:linear-gradient(135deg,#087d57 0%,#04a56f 58%,#0b8b61 100%);color:#fff;border:1px solid #00e0a0;border-radius:16px;padding:13px 12px;min-height:185px;position:relative;overflow:hidden;box-shadow:0 10px 30px #0005}.vehicle-card:before{content:'';position:absolute;width:210px;height:210px;border-radius:50%;right:-90px;top:-105px;background:#ffffff0b}.vehicle-card:after{content:'🚙';position:absolute;right:24px;top:17px;font-size:75px;opacity:.9;filter:grayscale(1) brightness(1.5)}.plate{display:inline-block;background:#f5f7f3;color:#16242b;border-radius:6px;padding:5px 8px;font-weight:900;font-size:12px;margin-top:7px;letter-spacing:.04em}.vehicle-name{font-size:23px;font-weight:900;letter-spacing:-.7px}.vehicle-meta{opacity:.92;font-size:11px;margin-top:3px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:20px;position:relative;z-index:2}.stat{background:#063d30b8;color:#dffbf3;border:1px solid #56e7bc66;border-radius:9px;padding:8px 8px;min-height:48px}.stat b{display:block;font-size:13px;color:#fff}.stat small{opacity:.9;font-size:8px;text-transform:uppercase;letter-spacing:.04em}.section-head{display:flex;justify-content:space-between;align-items:center;margin:15px 0 7px}.section-head h3{margin:0;font-size:15px;letter-spacing:-.2px}.link{color:var(--accent);font-size:9px;font-weight:850;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tile{background:linear-gradient(180deg,#081d2b,#061723);border:1px solid #174563;border-radius:10px;padding:9px;cursor:pointer;box-shadow:none;min-height:72px}.tile:active,.btn:active,.nav button:active{transform:scale(.98)}.tile .emoji{font-size:16px}.tile b{display:block;margin-top:4px;font-size:11px}.tile span{font-size:8px;color:#90a9b8}.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #14364a}.row:last-child{border-bottom:0}.row-left{display:flex;gap:9px;align-items:center}.mini{width:32px;height:32px;border-radius:9px;background:#0d2a3d;display:grid;place-items:center}.row small{color:var(--muted);display:block;margin-top:2px;font-size:9px}.pill{font-size:8px;font-weight:850;padding:5px 7px;border-radius:20px;background:#19b97818;color:var(--accent)}.pill.warn{background:#e09a2d1c;color:var(--warn)}.pill.danger{background:#d4585818;color:var(--danger)}.btn{border:0;border-radius:10px;padding:11px 13px;background:var(--accent);color:#05251a;font-weight:850;cursor:pointer;width:100%;font-size:12px}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.form{display:grid;gap:10px}.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:5px;text-transform:uppercase}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:9px;padding:10px;font:inherit}.back{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12px;cursor:pointer;margin-bottom:12px}.cost{font-size:26px;font-weight:850;letter-spacing:-1px}.chart{height:110px;display:flex;align-items:flex-end;gap:7px;padding:10px 5px 0;background:var(--surface2);border-radius:12px}.bar{flex:1;background:var(--accent);border-radius:6px 6px 2px 2px;opacity:.75}.bar:nth-child(2n){opacity:.5}.barlabel{font-size:8px;color:var(--muted);text-align:center;margin-top:3px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:66px;background:#031019f5;backdrop-filter:blur(16px);border-top:1px solid #16394d;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.nav button{border:0;background:none;color:#728b9b;font-size:9px;font-weight:750;cursor:pointer}.nav button.active{color:var(--accent)}.nav i{font-style:normal;display:block;font-size:19px;margin-bottom:2px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#15202b;color:#fff;padding:10px 13px;border-radius:10px;font-size:11px;opacity:0;pointer-events:none;transition:.25s;z-index:9}.toast.show{opacity:1}.empty{padding:28px 10px;text-align:center;color:var(--muted)}
</style></head><body><div id="app"><div class="phone"><header class="top"><div class="brand">Road<span>Log</span></div><button class="icon" onclick="toast('Notifications — 2 reminders due')">🔔</button></header><main id="screen" class="screen"></main><nav class="bottom nav"><button data-tab="home" onclick="go('home')"><i>⌂</i>Home</button><button data-tab="vehicles" onclick="go('vehicles')"><i>🚙</i>Vehicles</button><button data-tab="costs" onclick="go('costs')"><i>▤</i>Costs</button><button data-tab="more" onclick="go('more')"><i>•••</i>More</button></nav><div id="toast" class="toast"></div></div></div>
<script>
const saved=JSON.parse(localStorage.getItem('roadlog_state')||'null');
const state=saved||{fuel:185,maintenance:320,repairs:860,odometer:142350,activeVehicleId:'v1',vehicles:[{id:'v1',make:'Toyota',model:'Hilux',year:2021,rego:'ABC123',fuelType:'Diesel',odometer:142350,vin:'',fuel:185,maintenance:320,repairs:860,image:''}]};
if(!state.vehicles)state.vehicles=[{id:'v1',make:'Toyota',model:'Hilux',year:2021,rego:'ABC123',fuelType:'Diesel',odometer:state.odometer||142350,vin:'',fuel:state.fuel||185,maintenance:state.maintenance||320,repairs:state.repairs||860}];
if(!state.activeVehicleId)state.activeVehicleId=state.vehicles[0].id;
function activeVehicle(){return state.vehicles.find(v=>v.id===state.activeVehicleId)||state.vehicles[0]}
function sync(){const v=activeVehicle();if(v){state.odometer=v.odometer;state.fuel=v.fuel;state.maintenance=v.maintenance;state.repairs=v.repairs}}
function persist(){sync();localStorage.setItem('roadlog_state',JSON.stringify(state))}
function currentTime(){return new Intl.DateTimeFormat('en-NZ',{hour:'numeric',minute:'2-digit',hour12:true}).format(new Date())}
function selectVehicle(id){state.activeVehicleId=id;sync();persist();go('home')}
function addVehicle(){screen.innerHTML=`<div class="back" onclick="go('vehicles')">‹ Back to vehicles</div><div class="eyebrow">Garage</div><h1 class="title">Add vehicle</h1><div class="form"><div class="field"><label>Make</label><input id="vMake" value="Toyota"></div><div class="field"><label>Model</label><input id="vModel" value="RAV4"></div><div class="field"><label>Year</label><input id="vYear" type="number" value="2024"></div><div class="field"><label>Registration</label><input id="vRego" value="XYZ789"></div><div class="field"><label>Fuel type</label><select id="vFuel"><option>Petrol</option><option>Diesel</option><option>Hybrid</option><option>EV</option></select></div><div class="field"><label>Odometer (km)</label><input id="vOdo" type="number" value="50000"></div><div class="field"><label>VIN (optional)</label><input id="vVin"></div><div class="field"><label>Vehicle photo</label><input id="vImage" type="file" accept="image/*"><small style="display:block;margin-top:5px;color:var(--muted)">Add a photo of this vehicle to show on the dashboard.</small></div><button class="btn" onclick="saveVehicle()">Save vehicle</button></div>`}
function saveVehicle(){const file=document.getElementById('vImage')?.files?.[0];const create=image=>{const v={id:'v'+Date.now(),make:document.getElementById('vMake').value.trim()||'Vehicle',model:document.getElementById('vModel').value.trim()||'Model',year:+document.getElementById('vYear').value||new Date().getFullYear(),rego:document.getElementById('vRego').value.trim().toUpperCase()||'—',fuelType:document.getElementById('vFuel').value,odometer:+document.getElementById('vOdo').value||0,vin:document.getElementById('vVin').value.trim(),fuel:0,maintenance:0,repairs:0,fuelRecords:[],image:image||''};state.vehicles.push(v);state.activeVehicleId=v.id;persist();toast('Vehicle added');setTimeout(()=>go('vehicles'),450)};if(file){const reader=new FileReader();reader.onload=()=>create(reader.result);reader.readAsDataURL(file)}else create('')}
function deleteVehicle(id){if(state.vehicles.length===1){toast('Keep at least one vehicle');return}state.vehicles=state.vehicles.filter(v=>v.id!==id);if(state.activeVehicleId===id)state.activeVehicleId=state.vehicles[0].id;persist();go('vehicles')}
const screen=document.getElementById('screen');
function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===page));
 if(page==='home')home(); else if(page==='vehicles')vehicles(); else if(page==='costs')costs(); else more();}
function openGaspy(){window.open('https://gaspy.nz','_blank','noopener,noreferrer')}
function home(){const v=activeVehicle();const picker=state.vehicles.map(x=>`<div onclick="selectVehicle('${x.id}')" style="min-width:118px;flex:1;border:1px solid ${x.id===state.activeVehicleId?'#00e0a0':'#17415b'};background:${x.id===state.activeVehicleId?'#052c25':'#071925'};border-radius:9px;padding:6px;cursor:pointer;text-align:center"><div style="height:42px;display:grid;place-items:center;overflow:hidden;border-radius:7px;margin-bottom:3px">${x.image?`<img src="${x.image}" alt="${x.make} ${x.model}" style="width:100%;height:42px;object-fit:contain">`:'<span style="font-size:28px">🚙</span>'}</div><b style="font-size:8px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.make} ${x.model}</b><small style="font-size:7px;color:#91a8b8;display:block;margin-top:2px">${x.rego}</small>${x.id===state.activeVehicleId?'<span class="pill" style="display:inline-block;margin-top:4px">✓ Driving</span>':'<span class="link" style="display:block;margin-top:4px">Select</span>'}</div>`).join('');screen.innerHTML=`<div class="eyebrow">Sunday, 27 September</div><h1 class="title">Good afternoon, Garry</h1><div style="border:1px solid #17415b;background:#061723;border-radius:11px;padding:8px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div class="eyebrow" style="color:#00e0a0">Which vehicle are you driving?</div><span class="link">Select vehicle ›</span></div><div style="display:flex;gap:6px;overflow:hidden">${picker}</div></div><div class="vehicle-card" onclick="vehicle()"><div style="position:relative;z-index:1"><div class="eyebrow" style="color:#d7f5eb">DRIVING NOW</div><div class="vehicle-name" style="margin-top:2px">${v.make} ${v.model}</div><div class="vehicle-meta">${v.year} • ${v.fuelType} • ${v.odometer.toLocaleString()} km</div><div class="plate">${v.rego}</div><div class="stats"><div class="stat"><b>${v.fuelType==='EV'?'—':'12.1'}</b><small>${v.fuelType==='EV'?'kWh/100km':'L/100km'}</small></div><div class="stat"><b>$0.31</b><small>cost / km</small></div><div class="stat"><b>Good</b><small>status</small></div></div></div></div><div class="section-head"><h3>Quick actions</h3><span class="link" onclick="vehicle()">View all ›</span></div><div class="grid"><div class="tile" onclick="fuel()"><div class="emoji">⛽</div><b>Add fuel</b><span>Record a fill-up</span></div><div class="tile" onclick="maintenance()"><div class="emoji">🔧</div><b>Maintenance</b><span>Service & upkeep</span></div><div class="tile" onclick="repair()"><div class="emoji">🛠️</div><b>Log repair</b><span>Track repairs & faults</span></div><div class="tile" onclick="reminders()"><div class="emoji">🔔</div><b>Reminders</b><span>WOF, rego, service & more</span></div></div><div class="section-head"><h3>Reports</h3><span class="link" onclick="costs()">View all ›</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div class="tile" style="min-height:57px;padding:8px" onclick="vehicle()"><div style="font-size:14px">📋</div><b style="margin-top:2px">Vehicle Report</b><span>History, costs & more</span></div><div class="tile" style="min-height:57px;padding:8px" onclick="fuel()"><div style="font-size:14px">⛽</div><b style="margin-top:2px">Fuel Report</b><span>Usage & economy</span></div><div class="tile" style="min-height:57px;padding:8px" onclick="costs()"><div style="font-size:14px">💰</div><b style="margin-top:2px">Cost Report</b><span>Running costs & $/km</span></div><div class="tile" style="min-height:57px;padding:8px" onclick="tracking()"><div style="font-size:14px">📍</div><b style="margin-top:2px">Trip Report</b><span>Distance & business/private</span></div><div class="tile" style="min-height:57px;padding:8px" onclick="reminders()"><div style="font-size:14px">🛡️</div><b style="margin-top:2px">Compliance</b><span>WOF, rego, RUC insurance</span></div></div><div class="section-head"><h3>Reminders</h3><span class="link" onclick="reminders()">View all ›</span></div><div class="row"><div class="row-left"><div class="mini">📋</div><div><b>WOF expiry</b><small>${v.make} ${v.model} • 14 Dec 2026 (77 days)</small></div></div><span class="pill warn">!</span></div><div class="row" onclick="maintenance()"><div class="row-left"><div class="mini">🔧</div><div><b>Service due</b><small>${v.make} ${v.model} • 680 km (or 24 days)</small></div></div><span class="pill">!</span></div>`}
function vehicles(){const v=activeVehicle();screen.innerHTML=`<div class="eyebrow">Garage</div><h1 class="title">My vehicles</h1>${state.vehicles.map(x=>`<div class="vehicle-card" style="margin-bottom:12px;cursor:pointer" onclick="selectVehicle('${x.id}')"><div class="vehicle-name">${x.make} ${x.model}</div><div class="vehicle-meta">${x.year} • ${x.fuelType} • ${x.odometer.toLocaleString()} km</div><div class="plate">${x.rego}</div><div class="stats"><div class="stat"><b>${x.fuelType==='EV'?'—':'12.1'}</b><small>${x.fuelType==='EV'?'kWh/100km':'L/100km'}</small></div><div class="stat"><b>$${(x.fuel+x.maintenance+x.repairs).toLocaleString()}</b><small>recorded cost</small></div><div class="stat"><b>${x.id===state.activeVehicleId?'Active':'Select'}</b><small>vehicle</small></div></div></div>`).join('')}<div class="btnrow"><button class="btn" onclick="addVehicle()">+ Add vehicle</button><button class="btn secondary" onclick="vehicle()">Open selected</button></div><div class="section-head"><h3>Selected vehicle</h3></div><div class="row"><div class="row-left"><div class="mini">🔑</div><div><b>VIN</b><small>${v.vin||'Not entered'}</small></div></div></div><div class="row"><div class="row-left"><div class="mini">📍</div><div><b>Tracking</b><small>Last trip: 18.4 km</small></div></div><span class="pill">Ready</span></div>`}
function vehicle(){const v=activeVehicle();screen.innerHTML=`<div class="back" onclick="go('vehicles')">‹ Back to vehicles</div><div class="eyebrow">Vehicle profile</div><h1 class="title">${v.make} ${v.model}</h1><div class="vehicle-card"><div class="vehicle-name">${v.rego}</div><div class="vehicle-meta">${v.year} • ${v.fuelType}</div><div class="plate">${v.odometer.toLocaleString()} km</div></div><div class="section-head"><h3>Vehicle details</h3></div><div class="row"><div class="row-left"><div class="mini">🔑</div><div><b>VIN</b><small>${v.vin||'Not entered'}</small></div></div></div><div class="row"><div class="row-left"><div class="mini">⛽</div><div><b>Fuel type</b><small>${v.fuelType}</small></div></div></div><div class="section-head"><h3>Manage vehicle</h3></div><div class="grid"><div class="tile" onclick="fuel()"><div class="emoji">⛽</div><b>Fuel</b><span>Usage & spend</span></div><div class="tile" onclick="maintenance()"><div class="emoji">🔧</div><b>Maintenance</b><span>Service history</span></div><div class="tile" onclick="repair()"><div class="emoji">🛠️</div><b>Repairs</b><span>Faults & costs</span></div><div class="tile" onclick="tracking()"><div class="emoji">📍</div><b>Trips</b><span>Vehicle movement</span></div></div><div class="section-head"><h3>Vehicle actions</h3></div><button class="btn secondary" onclick="deleteVehicle('${v.id}')">Remove this vehicle</button>`}
function fuel(){const v=activeVehicle(),records=v.fuelRecords||[];const history=records.map(r=>`<div class="row"><div class="row-left"><div class="mini">⛽</div><div><b>${r.station||'Fuel station'}</b><small>${r.date} • ${Number(r.litres).toFixed(1)} L • ${Number(r.odo).toLocaleString()} km</small></div></div><b>$${Number(r.cost||0).toFixed(2)}</b></div>`).join('');screen.innerHTML=`<div class="back" onclick="go('home')">‹ Back</div><div class="eyebrow">Fuel</div><h1 class="title">${v.make} ${v.model}</h1><div class="vehicle-card" style="min-height:145px"><div class="vehicle-name">$${Number(v.fuel||0).toFixed(2)} recorded</div><div class="vehicle-meta">Fuel spend for this vehicle • ${v.odometer.toLocaleString()} km</div><div class="stats"><div class="stat"><b>${records.reduce((a,r)=>a+Number(r.litres||0),0).toFixed(1)} L</b><small>fuel recorded</small></div><div class="stat"><b>${records.length?('$'+(records.reduce((a,r)=>a+Number(r.cost||0),0)/records.reduce((a,r)=>a+Number(r.litres||0),0)).toFixed(2)):'—'}</b><small>avg / litre</small></div><div class="stat"><b>${records.length}</b><small>fill-ups</small></div></div></div><div class="section-head"><h3>Fuel history</h3><span class="link" onclick="addFuel()">+ Add fuel</span></div>${history||'<div class="empty">No fuel entries for this vehicle yet.</div>'}<div class="section-head"><h3>Monthly spend</h3></div><div class="chart"><div class="bar" style="height:45%"></div><div class="bar" style="height:62%"></div><div class="bar" style="height:52%"></div><div class="bar" style="height:74%"></div><div class="bar" style="height:68%"></div><div class="bar" style="height:85%"></div></div>`}
function addFuel(){screen.innerHTML=`<div class="back" onclick="fuel()">‹ Back to fuel</div><div class="eyebrow">New entry</div><h1 class="title">Add fuel</h1><div class="form"><div class="field"><label>Litres</label><input id="litres" type="number" value="55"></div><div class="field"><label>Total cost (NZD)</label><input id="price" type="number" value="112.75"></div><div class="field"><label>Odometer (km)</label><input id="odo" type="number" value="${state.odometer}"></div><div class="field"><label>Station</label><input value="Z Energy"></div><button class="btn" onclick="saveFuel()">Save fuel entry</button></div>`}
function saveFuel(){const v=activeVehicle(),litres=+document.getElementById('litres').value||0,cost=+document.getElementById('price').value||0,o=+document.getElementById('odo').value||v.odometer,station=document.querySelectorAll('.form .field')[3].querySelector('input').value.trim();v.odometer=Math.max(v.odometer,o);v.fuel=(v.fuel||0)+cost;if(!v.fuelRecords)v.fuelRecords=[];v.fuelRecords.unshift({date:new Date().toISOString().slice(0,10),litres,cost,odo:o,station});persist();toast('Fuel entry saved');setTimeout(fuel,450)}
function maintenance(){const v=activeVehicle(),records=v.maintenanceRecords||[];const history=records.map(r=>`<div class="row"><div class="row-left"><div class="mini">🔧</div><div><b>${r.work}</b><small>${r.date} • ${Number(r.odo).toLocaleString()} km${r.workshop?' • '+r.workshop:''}</small></div></div><b>$${Number(r.cost||0).toLocaleString()}</b></div>`).join('');const total=Number(v.maintenance||0);screen.innerHTML=`<div class="back" onclick="go('home')">‹ Back</div><div class="eyebrow">Maintenance</div><h1 class="title">Service & upkeep</h1><div class="vehicle-card" style="min-height:125px"><div class="eyebrow" style="color:#d7f5eb">TOTAL MAINTENANCE</div><div class="cost">$${total.toLocaleString()}</div><div class="vehicle-meta">Total recorded maintenance for ${v.make} ${v.model}</div></div><div class="section-head"><h3>Next due</h3><span class="pill">1,200 km</span></div><div class="tile"><div class="emoji">🔧</div><b>Regular service</b><span>Oil, filters, inspection</span><div class="btnrow"><button class="btn" onclick="addMaintenance()">Log service</button><button class="btn secondary" onclick="toast('Reminder set for 143,550 km')">Set reminder</button></div></div><div class="section-head"><h3>Service history</h3></div>${history||'<div class="empty">No maintenance records yet.</div>'}`}
function addMaintenance(){screen.innerHTML=`<div class="back" onclick="maintenance()">‹ Back</div><div class="eyebrow">New record</div><h1 class="title">Log maintenance</h1><div class="form"><div class="field"><label>Work performed</label><input value="Regular service"></div><div class="field"><label>Odometer</label><input type="number" value="${state.odometer}"></div><div class="field"><label>Cost (NZD)</label><input type="number" value="320"></div><div class="field"><label>Workshop</label><input value="My Mechanic"></div><div class="field"><label>Notes</label><textarea rows="3">Oil and filters replaced</textarea></div><button class="btn" onclick="toast('Maintenance record saved');setTimeout(maintenance,450)">Save maintenance</button></div>`}
function saveMaintenance(){const v=activeVehicle(),fields=document.querySelectorAll('.form .field');const work=fields[0].querySelector('input').value.trim()||'Maintenance';const odo=+fields[1].querySelector('input').value||v.odometer;const cost=+fields[2].querySelector('input').value||0;const workshop=fields[3].querySelector('input').value.trim();const notes=fields[4].querySelector('textarea').value.trim();v.odometer=Math.max(v.odometer,odo);v.maintenance+=cost;if(!v.maintenanceRecords)v.maintenanceRecords=[];v.maintenanceRecords.unshift({date:new Date().toISOString().slice(0,10),work,odo,cost,workshop,notes});persist();toast('Maintenance record saved');setTimeout(maintenance,450)}
function addMaintenance(){screen.innerHTML=`<div class="back" onclick="maintenance()">‹ Back</div><div class="eyebrow">New record</div><h1 class="title">Log maintenance</h1><div class="form"><div class="field"><label>Work performed</label><input id="mWork" value="Regular service"></div><div class="field"><label>Odometer</label><input id="mOdo" type="number" value="${state.odometer}"></div><div class="field"><label>Cost (NZD)</label><input id="mCost" type="number" value="320"></div><div class="field"><label>Workshop</label><input id="mWorkshop" value="My Mechanic"></div><div class="field"><label>Notes</label><textarea id="mNotes" rows="3">Oil and filters replaced</textarea></div><button class="btn" onclick="saveMaintenance()">Save maintenance</button></div>`}
function repair(){const v=activeVehicle(),records=v.repairRecords||[];const history=records.map(r=>`<div class="row"><div class="row-left"><div class="mini">🛠️</div><div><b>${r.problem}</b><small>${r.date} • ${Number(r.odo).toLocaleString()} km • ${r.status}</small></div></div><b>$${Number(r.cost||0).toLocaleString()}</b></div>`).join('');screen.innerHTML=`<div class="back" onclick="go('home')">‹ Back</div><div class="eyebrow">Repairs</div><h1 class="title">Repairs & faults</h1><button class="btn" onclick="addRepair()">+ Log a repair</button><div class="section-head"><h3>Saved repairs</h3></div>${history||'<div class="empty">No repairs recorded yet.</div>'}<div class="section-head"><h3>Previous records</h3></div><div class="row"><div class="row-left"><div class="mini">🛠️</div><div><b>Brake pads</b><small>21 Jul 2026 • Front • Completed</small></div></div><b>$480</b></div><div class="row"><div class="row-left"><div class="mini">⚠️</div><div><b>Engine warning</b><small>3 Mar 2026 • Diagnostic • Completed</small></div></div><b>$180</b></div><div class="row"><div class="row-left"><div class="mini">🛞</div><div><b>Puncture</b><small>14 Jan 2026 • Rear • Completed</small></div></div><b>$95</b></div>`}
function saveRepair(){const v=activeVehicle(),fields=document.querySelectorAll('.form .field');const problem=fields[0].querySelector('input').value.trim()||'Repair';const odo=+fields[1].querySelector('input').value||v.odometer;const cost=+fields[2].querySelector('input').value||0;const status=fields[3].querySelector('select').value;const notes=fields[4].querySelector('textarea').value.trim();v.odometer=Math.max(v.odometer,odo);v.repairs+=cost;if(!v.repairRecords)v.repairRecords=[];v.repairRecords.unshift({date:new Date().toISOString().slice(0,10),problem,odo,cost,status,notes});persist();toast('Repair saved');setTimeout(repair,450)}
function addRepair(){screen.innerHTML=`<div class="back" onclick="repair()">‹ Back</div><div class="eyebrow">New repair</div><h1 class="title">Log a repair</h1><div class="form"><div class="field"><label>Problem / repair</label><input id="rProblem" value="Brake pads"></div><div class="field"><label>Odometer</label><input id="rOdo" type="number" value="${state.odometer}"></div><div class="field"><label>Cost (NZD)</label><input id="rCost" type="number" value="480"></div><div class="field"><label>Status</label><select id="rStatus"><option>Completed</option><option>In progress</option><option>Waiting for parts</option></select></div><div class="field"><label>Notes</label><textarea id="rNotes" rows="3">Front brake pads replaced</textarea></div><button class="btn" onclick="saveRepair()">Save repair</button></div>`}
function reminders(){screen.innerHTML=`<div class="back" onclick="go('home')">‹ Back</div><div class="eyebrow">Reminders</div><h1 class="title">Upcoming</h1><div class="row"><div class="row-left"><div class="mini">🔧</div><div><b>Regular service</b><small>Due at 143,550 km</small></div></div><span class="pill">1,200 km</span></div><div class="row"><div class="row-left"><div class="mini">📋</div><div><b>WOF</b><small>Expires 14 Dec 2026</small></div></div><span class="pill warn">82 days</span></div><div class="row"><div class="row-left"><div class="mini">🛞</div><div><b>Tyre inspection</b><small>Due at 144,350 km</small></div></div><span class="pill">2,000 km</span></div>`}
function costs(){const v=activeVehicle(),fuelTotal=Number(v.fuel||0),maintenanceTotal=Number(v.maintenance||0),repairTotal=Number(v.repairs||0),total=fuelTotal+maintenanceTotal+repairTotal,pct=x=>total?((x/total)*100).toFixed(1):'0.0';screen.innerHTML=`<div class="eyebrow">Running costs</div><h1 class="title">Vehicle costs</h1><div class="vehicle-card"><div class="eyebrow" style="color:#d7f5eb">TOTAL RECORDED</div><div class="cost">$ ${total.toLocaleString()}</div><div class="vehicle-meta">Recorded costs for ${v.make} ${v.model}</div></div><div class="section-head"><h3>Cost breakdown</h3></div><div class="row"><div class="row-left"><div class="mini">⛽</div><div><b>Fuel</b><small>${pct(fuelTotal)}% of total</small></div></div><b>$${fuelTotal.toLocaleString()}</b></div><div class="row"><div class="row-left"><div class="mini">🔧</div><div><b>Maintenance</b><small>${pct(maintenanceTotal)}% of total</small></div></div><b>$${maintenanceTotal.toLocaleString()}</b></div><div class="row"><div class="row-left"><div class="mini">🛠️</div><div><b>Repairs</b><small>${pct(repairTotal)}% of total</small></div></div><b>$${repairTotal.toLocaleString()}</b></div><div class="section-head"><h3>Monthly trend</h3></div><div class="chart"><div class="bar" style="height:42%"></div><div class="bar" style="height:58%"></div><div class="bar" style="height:47%"></div><div class="bar" style="height:65%"></div><div class="bar" style="height:74%"></div><div class="bar" style="height:82%"></div></div>`}
function tracking(){screen.innerHTML=`<div class="back" onclick="vehicle()">‹ Back</div><div class="eyebrow">Vehicle movement</div><h1 class="title">Trips</h1><div class="tile"><div class="emoji">📍</div><b>Tracking active</b><span>Last update 4 minutes ago</span><div style="margin-top:15px;background:var(--surface);border-radius:14px;height:145px;display:grid;place-items:center;font-size:42px">🗺️</div></div><div class="section-head"><h3>Recent trips</h3></div><div class="row"><div class="row-left"><div class="mini">→</div><div><b>Work → Home</b><small>18.4 km • 27 min</small></div></div><span class="pill">Today</span></div><div class="row"><div class="row-left"><div class="mini">→</div><div><b>Home → Work</b><small>21.1 km • 31 min</small></div></div><span class="pill">Today</span></div>`}
function more(){screen.innerHTML=`<div class="eyebrow">Settings</div><h1 class="title">More</h1><div class="row"><div class="row-left"><div class="mini">👤</div><div><b>Drivers</b><small>Manage driver access</small></div></div><span>›</span></div><div class="row"><div class="row-left"><div class="mini">📄</div><div><b>Documents</b><small>Invoices, WOF & service records</small></div></div><span>›</span></div><div class="row"><div class="row-left"><div class="mini">⚙️</div><div><b>App settings</b><small>Notifications & preferences</small></div></div><span>›</span></div><div class="row"><div class="row-left"><div class="mini">🏢</div><div><b>Fleet mode</b><small>Coming in Version 2</small></div></div><span class="pill">Soon</span></div>`}
function decorateHome(){if(!screen.querySelector('.vehicle-card'))return;const v=activeVehicle();const card=screen.querySelector('.vehicle-card');if(card&&v.image){if(!document.getElementById('vehiclePhotoStyles')){const s=document.createElement('style');s.id='vehiclePhotoStyles';s.textContent='.vehicle-card.has-photo:after{content:none!important}.vehicle-card .user-car-image{position:absolute;right:10px;top:8px;width:48%;max-width:205px;height:105px;object-fit:contain;z-index:1;filter:drop-shadow(0 8px 10px #0007);pointer-events:none}';document.head.appendChild(s)}card.classList.add('has-photo');const img=document.createElement('img');img.className='user-car-image';img.src=v.image;img.alt=v.make+' '+v.model;card.appendChild(img)}const children=[...screen.children];if(children[1]&&children[1].classList.contains('eyebrow'))children[1].remove();const heads=[...screen.querySelectorAll('.section-head')];const fuelHead=heads.find(x=>x.querySelector('h3')?.textContent==='Fuel prices');if(fuelHead){let n=fuelHead;while(n){const next=n.nextElementSibling;n.remove();n=next}}const reports=document.createElement('div');reports.innerHTML=`<div class="section-head"><h3>Reports</h3><span class="link" onclick="costs()">View all ›</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="tile" style="min-height:58px;padding:10px" onclick="vehicle()"><div style="font-size:16px">📋</div><b style="margin-top:3px">Vehicle Report</b><span>History & costs</span></div><div class="tile" style="min-height:58px;padding:10px" onclick="fuel()"><div style="font-size:16px">⛽</div><b style="margin-top:3px">Fuel Report</b><span>Usage & economy</span></div><div class="tile" style="min-height:58px;padding:10px" onclick="costs()"><div style="font-size:16px">💰</div><b style="margin-top:3px">Cost Report</b><span>Running costs</span></div><div class="tile" style="min-height:58px;padding:10px" onclick="tracking()"><div style="font-size:16px">📍</div><b style="margin-top:3px">Trip Report</b><span>Distance & trips</span></div><div class="tile" style="min-height:58px;padding:10px" onclick="reminders()"><div style="font-size:16px">✓</div><b style="margin-top:3px">Compliance</b><span>WOF, rego, RUC</span></div></div>`;screen.appendChild(reports.firstElementChild);screen.appendChild(reports.lastElementChild);const picker=screen.children[2];if(picker&&picker.style){picker.style.background='#061018';picker.style.border='1px solid #285b79';picker.style.borderRadius='22px';picker.style.minHeight='0';picker.style.padding='12px 13px';picker.style.boxShadow='none'}}
const roadlogHome=home;home=function(){roadlogHome();decorateHome()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
go('home');
</script></body></html>

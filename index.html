<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#18a66a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="RoadLog"><link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22RoadLog%22%2C%22short_name%22%3A%22RoadLog%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%230b1116%22%2C%22theme_color%22%3A%22%2318a66a%22%7D">
<title>RoadLog — Vehicle Management</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#eef2f5,#0b1116);--surface:light-dark(#fff,#111920);--surface2:light-dark(#f5f7f8,#18232b);--text:light-dark(#15202b,#f4f7f9);--muted:light-dark(#697681,#9eabb4);--line:light-dark(#dce3e7,#293640);--accent:#18a66a;--accent2:#0e7f50;--warn:#d88a19;--danger:#c94b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}#app{min-height:100vh;background:var(--bg)}
.phone{width:min(430px,100%);min-height:100vh;margin:auto;background:var(--surface);position:relative;padding-bottom:78px;overflow:hidden}.top{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:-.5px;font-size:22px}.brand span{color:var(--accent)}.icon{border:1px solid var(--line);background:var(--surface2);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;font-size:18px}.screen{padding:8px 20px 24px}.eyebrow{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.title{font-size:29px;line-height:1.1;margin:4px 0 18px;font-weight:800;letter-spacing:-1px}.vehicle-card{background:linear-gradient(145deg,#173329,#0e5d3d);color:#fff;border-radius:22px;padding:18px;min-height:178px;position:relative;overflow:hidden;box-shadow:0 12px 30px #0b5b3a22}.vehicle-card:after{content:'🚙';position:absolute;right:-5px;bottom:-18px;font-size:120px;opacity:.18;filter:grayscale(1)}.plate{display:inline-block;background:#f7f7f2;color:#15191c;border-radius:6px;padding:4px 9px;font-weight:800;font-size:13px;margin-top:12px}.vehicle-name{font-size:23px;font-weight:800}.vehicle-meta{opacity:.8;font-size:13px;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px}.stat{background:#ffffff18;border:1px solid #ffffff1f;border-radius:12px;padding:9px}.stat b{display:block;font-size:15px}.stat small{opacity:.7;font-size:10px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.section-head h3{margin:0;font-size:16px}.link{color:var(--accent);font-size:12px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--surface2);border:1px solid var(--line);border-radius:17px;padding:15px;cursor:pointer}.tile:active,.btn:active,.nav button:active{transform:scale(.98)}.tile .emoji{font-size:24px}.tile b{display:block;margin-top:8px}.tile span{font-size:11px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-left{display:flex;gap:11px;align-items:center}.mini{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center}.row small{color:var(--muted);display:block;margin-top:2px}.pill{font-size:10px;font-weight:800;padding:5px 8px;border-radius:20px;background:#18a66a1a;color:var(--accent)}.pill.warn{background:#d88a191c;color:var(--warn)}.pill.danger{background:#c94b4b18;color:var(--danger)}.btn{border:0;border-radius:14px;padding:13px 16px;background:var(--accent);color:white;font-weight:800;cursor:pointer;width:100%;font-size:14px}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.form{display:grid;gap:12px}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px;text-transform:uppercase}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:12px;padding:12px;font:inherit}.back{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:15px}.cost{font-size:30px;font-weight:850;letter-spacing:-1px}.chart{height:120px;display:flex;align-items:flex-end;gap:8px;padding:12px 5px 0;background:var(--surface2);border-radius:16px}.bar{flex:1;background:var(--accent);border-radius:7px 7px 2px 2px;opacity:.75}.bar:nth-child(2n){opacity:.5}.barlabel{font-size:9px;color:var(--muted);text-align:center;margin-top:4px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:72px;background:light-dark(#ffffffee,#111920ee);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.nav button{border:0;background:none;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer}.nav button.active{color:var(--accent)}.nav i{font-style:normal;display:block;font-size:21px;margin-bottom:3px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#15202b;color:#fff;padding:11px 15px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:9}.toast.show{opacity:1}.empty{padding:35px 10px;text-align:center;color:var(--muted)}
</style></head><body><div id="app"><div class="phone"><header class="top"><div class="brand">Road<span>Log</span></div><button class="icon" onclick="toast('Notifications — 2 reminders due')">🔔</button></header><main id="screen" class="screen"></main><nav class="bottom nav"><button data-tab="home" onclick="go('home')"><i>⌂</i>Home</button><button data-tab="vehicles" onclick="go('vehicles')"><i>🚙</i>Vehicles</button><button data-tab="costs" onclick="go('costs')"><i>▤</i>Costs</button><button data-tab="more" onclick="go('more')"><i>•••</i>More</button></nav><div id="toast" class="toast"></div></div></div>
<script>
const saved=JSON.parse(localStorage.getItem('roadlog_state')||'null');
const state=saved||{fuel:185,maintenance:320,repairs:860,odometer:142350,activeVehicleId:'v1',vehicles:[{id:'v1',make:'Toyota',model:'Hilux',year:2021,rego:'ABC123',fuelType:'Diesel',odometer:142350,vin:'',fuel:185,maintenance:320,repairs:860}]};
if(!state.vehicles)state.vehicles=[{id:'v1',make:'Toyota',model:'Hilux',year:2021,rego:'ABC123',fuelType:'Diesel',odometer:state.odometer||142350,vin:'',fuel:state.fuel||185,maintenance:state.maintenance||320,repairs:state.repairs||860}];
if(!state.activeVehicleId)state.activeVehicleId=state.vehicles[0].id;
function activeVehicle(){return state.vehicles.find(v=>v.id===state.activeVehicleId)||state.vehicles[0]}
function sync(){const v=activeVehicle();if(v){state.odometer=v.odometer;state.fuel=v.fuel;state.maintenance=v.maintenance;state.repairs=v.repairs}}
function persist(){sync();localStorage.setItem('roadlog_state',JSON.stringify(state))}
function selectVehicle(id){state.activeVehicleId=id;sync();persist();go('home')}
function addVehicle(){screen.innerHTML=`<div class="back" onclick="go('vehicles')">‹ Back to vehicles</div><div class="eyebrow">Garage</div><h1 class="title">Add vehicle</h1><div class="form"><div class="field"><label>Make</label><input id="vMake" value="Toyota"></div><div class="field"><label>Model</label><input id="vModel" value="RAV4"></div><div class="field"><label>Year</label><input id="vYear" type="number" value="2024"></div><div class="field"><label>Registration</label><input id="vRego" value="XYZ789"></div><div class="field"><label>Fuel type</label><select id="vFuel"><option>Petrol</option><option>Diesel</option><option>Hybrid</option><option>EV</option></select></div><div class="field"><label>Odometer (km)</label><input id="vOdo" type="number" value="50000"></div><div class="field"><label>VIN (optional)</label><input id="vVin"></div><button class="btn" onclick="saveVehicle()">Save vehicle</button></div>`}
function saveVehicle(){const v={id:'v'+Date.now(),make:document.getElementById('vMake').value.trim()||'Vehicle',model:document.getElementById('vModel').value.trim()||'Model',year:+document.getElementById('vYear').value||new Date().getFullYear(),rego:document.getElementById('vRego').value.trim().toUpperCase()||'—',fuelType:document.getElementById('vFuel').value,odometer:+document.getElementById('vOdo').value||0,vin:document.getElementById('vVin').value.trim(),fuel:0,maintenance:0,repairs:0};state.vehicles.push(v);state.activeVehicleId=v.id;persist();toast('Vehicle added');setTimeout(()=>go('vehicles'),450)}
function deleteVehicle(id){if(state.vehicles.length===1){toast('Keep at least one vehicle');return}state.vehicles=state.vehicles.filter(v=>v.id!==id);if(state.activeVehicleId===id)state.activeVehicleId=state.vehicles[0].id;persist();go('vehicles')}
const screen=document.getElementById('screen');
function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===page));
 if(page==='home')home(); else if(page==='vehicles')vehicles(); else if(page==='costs')costs(); else more();}
function home(){const v=activeVehicle();screen.innerHTML=`<div class="eyebrow">Sunday, 27 September</div><h1 class="title">Good afternoon</h1><div class="vehicle-card" onclick="vehicle()"><div class="vehicle-name">${v.make} ${v.model}</div><div class="vehicle-meta">${v.year} • ${v.fuelType} • ${v.odometer.toLocaleString()} km</div><div class="plate">${v.rego}</div><div class="stats"><div class="stat"><b>${v.fuelType==='EV'?'—':'12.1'}</b><small>${v.fuelType==='EV'?'kWh/100km':'L/100km'}</small></div><div class="stat"><b>$0.31</b><small>cost/km</small></div><div class="stat"><b>Good</b><small>vehicle status</small></div></div></div><div class="section-head"><h3>Quick actions</h3></div><div class="grid"><div class="tile" onclick="fuel()"><div class="emoji">⛽</div><b>Add fuel</b><span>Record a fill-up</span></div><div class="tile" onclick="maintenance()"><div class="emoji">🔧</div><b>Maintenance</b><span>Service & upkeep</span></div><div class="tile" onclick="repair()"><div class="emoji">🛠️</div><b>Log repair</b><span>Record a fault</span></div><div class="tile" onclick="reminders()"><div class="emoji">🔔</div><b>Reminders</b><span>2 upcoming</span></div></div><div class="section-head"><h3>Upcoming</h3><span class="link" onclick="reminders()">View all</span></div><div class="row" onclick="maintenance()"><div class="row-left"><div class="mini">🔧</div><div><b>Service</b><small>Due in 1,200 km</small></div></div><span class="pill">1,200 km</span></div><div class="row"><div class="row-left"><div class="mini">📋</div><div><b>WOF</b><small>Expires 14 Dec 2026</small></div></div><span class="pill warn">82 days</span></div>`}
function vehicles(){const v=activeVehicle();screen.innerHTML=`<div class="eyebrow">Garage</div><h1 class="title">My vehicles</h1>${state.vehicles.map(x=>`<div class="vehicle-card" style="margin-bottom:12px;cursor:pointer" onclick="selectVehicle('${x.id}')"><div class="vehicle-name">${x.make} ${x.model}</div><div class="vehicle-meta">${x.year} • ${x.fuelType} • ${x.odometer.toLocaleString()} km</div><div class="plate">${x.rego}</div><div class="stats"><div class="stat"><b>${x.fuelType==='EV'?'—':'12.1'}</b><small>${x.fuelType==='EV'?'kWh/100km':'L/100km'}</small></div><div class="stat"><b>$${(x.fuel+x.maintenance+x.repairs).toLocaleString()}</b><small>recorded cost</small></div><div class="stat"><b>${x.id===state.activeVehicleId?'Active':'Select'}</b><small>vehicle</small></div></div></div>`).join('')}<div class="btnrow"><button class="btn" onclick="addVehicle()">+ Add vehicle</button><button class="btn secondary" onclick="vehicle()">Open selected</button></div><div class="section-head"><h3>Selected vehicle</h3></div><div class="row"><div class="row-left"><div class="mini">🔑</div><div><b>VIN</b><small>${v.vin||'Not entered'}</small></div></div></div><div class="row"><div class="row-left"><div class="mini">📍</div><div><b>Tracking</b><small>Last trip: 18.4 km</small></div></div><span class="pill">Ready</span></div>`}
function vehicle(){const v=activeVehicle();screen.innerHTML=`<div class="back" onclick="go('vehicles')">‹ Back to vehicles</div><div class="eyebrow">Vehicle profile</div><h1 class="title">${v.make} ${v.model}</h1><div class="vehicle-card"><div class="vehicle-name">${v.rego}</div><div class="vehicle-meta">${v.year} • ${v.fuelType}</div><div class="plate">${v.odometer.toLocaleString()} km</div></div><div class="section-head"><h3>Vehicle details</h3></div><div class="row"><div class="row-left"><div class="mini">🔑</div><div><b>VIN</b><small>${v.vin||'Not entered'}</small></div></div></div><div class="row"><div class="row-left"><div class="mini">⛽</div><div><b>Fuel type</b><small>${v.fuelType}</small></div></div></div><div class="section-head"><h3>Manage vehicle</h3></div><div class="grid"><div class="tile" onclick="fuel()"><div class="emoji">⛽</div><b>Fuel</b><span>Usage & spend</span></div><div class="tile" onclick="maintenance()"><div class="emoji">🔧</div><b>Maintenance</b><span>Service history</span></div><div class="tile" onclick="repair()"><div class="emoji">🛠️</div><b>Repairs</b><span>Faults & costs</span></div><div class="tile" onclick="tracking()"><div class="emoji">📍</div><b>Trips</b><span>Vehicle movement</span></div></div><div class="section-head"><h3>Vehicle actions</h3></div><button class="btn secondary" onclick="deleteVehicle('${v.id}')">Remove this vehicle</button>`}
function fuel(){screen.innerHTML=`<div class="back" onclick="go('home')">‹ Back to fuel</div><div class="eyebrow">Fuel</div><h1 class="title">Fuel usage</h1><div class="vehicle-card" style="min-height:145px"><div class="vehicle-name">$${state.fuel} this month</div><div class="vehicle-meta">12.1 L/100km average • 1,520 km</div><div class="stats"><div class="stat"><b>126 L</b><small>fuel used</small></div><div class="stat"><b>$2.05</b><small>avg / litre</small></div><div class="stat"><b>12.1</b><small>L/100km</small></div></div></div><div class="section-head"><h3>September</h3><span class="link" onclick="addFuel()">+ Add fuel</span></div><div class="row"><div class="row-left"><div class="mini">⛽</div><div><b>BP</b><small>18 Sep • 62.4 L • 142,100 km</small></div></div><b>$128.00</b></div><div class="row"><div class="row-left"><div class="mini">⛽</div><div><b>Z</b><small>6 Sep • 28.0 L • 141,620 km</small></div></div><b>$57.40</b></div><div class="section-head"><h3>Monthly spend</h3></div><div class="chart"><div class="bar" style="height:45%"></div><div class="bar" style="height:62%"></div><div class="bar" style="height:52%"></div><div class="bar" style="height:74%"></div><div class="bar" style="height:68%"></div><div class="bar" style="height:85%"></div></div>`}
function addFuel(){screen.innerHTML=`<div class="back" onclick="fuel()">‹ Back to fuel</div><div class="eyebrow">New entry</div><h1 class="title">Add fuel</h1><div class="form"><div class="field"><label>Litres</label><input id="litres" type="number" value="55"></div><div class="field"><label>Total cost (NZD)</label><input id="price" type="number" value="112.75"></div><div class="field"><label>Odometer (km)</label><input id="odo" type="number" value="${state.odometer}"></div><div class="field"><label>Station</label><input value="Z Energy"></div><button class="btn" onclick="saveFuel()">Save fuel entry</button></div>`}
function saveFuel(){const v=activeVehicle(),o=+document.getElementById('odo').value;v.odometer=Math.max(v.odometer,o);v.fuel+=(+document.getElementById('price').value);persist();toast('Fuel entry saved');setTimeout(fuel,450)}
function maintenance(){screen.innerHTML=`<div class="back" onclick="go('home')">‹ Back</div><div class="eyebrow">Maintenance</div><h1 class="title">Service & upkeep</h1><div class="section-head"><h3>Next due</h3><span class="pill">1,200 km</span></div><div class="tile"><div class="emoji">🔧</div><b>Regular service</b><span>Oil, filters, inspection</span><div class="btnrow"><button class="btn" onclick="addMaintenance()">Log service</button><button class="btn secondary" onclick="toast('Reminder set for 143,550 km')">Set reminder</button></div></div><div class="section-head"><h3>Service history</h3></div><div class="row"><div class="row-left"><div class="mini">🔧</div><div><b>Major service</b><small>12 May 2026 • 138,420 km</small></div></div><b>$420</b></div><div class="row"><div class="row-left"><div class="mini">🛞</div><div><b>Front tyres</b><small>2 Feb 2026 • 132,810 km</small></div></div><b>$680</b></div>`}
function addMaintenance(){screen.innerHTML=`<div class="back" onclick="maintenance()">‹ Back</div><div class="eyebrow">New record</div><h1 class="title">Log maintenance</h1><div class="form"><div class="field"><label>Work performed</label><input value="Regular service"></div><div class="field"><label>Odometer</label><input type="number" value="${state.odometer}"></div><div class="field"><label>Cost (NZD)</label><input type="number" value="320"></div><div class="field"><label>Workshop</label><input value="My Mechanic"></div><div class="field"><label>Notes</label><textarea rows="3">Oil and filters replaced</textarea></div><button class="btn" onclick="toast('Maintenance record saved');setTimeout(maintenance,450)">Save maintenance</button></div>`}
function repair(){screen.innerHTML=`<div class="back" onclick="go('home')">‹ Back</div><div class="eyebrow">Repairs</div><h1 class="title">Repairs & faults</h1><button class="btn" onclick="addRepair()">+ Log a repair</button><div class="section-head"><h3>Repair history</h3></div><div class="row"><div class="row-left"><div class="mini">🛠️</div><div><b>Brake pads</b><small>21 Jul 2026 • Front • Completed</small></div></div><b>$480</b></div><div class="row"><div class="row-left"><div class="mini">⚠️</div><div><b>Engine warning</b><small>3 Mar 2026 • Diagnostic • Completed</small></div></div><b>$180</b></div><div class="row"><div class="row-left"><div class="mini">🛞</div><div><b>Puncture</b><small>14 Jan 2026 • Rear • Completed</small></div></div><b>$95</b></div>`}
function addRepair(){screen.innerHTML=`<div class="back" onclick="repair()">‹ Back</div><div class="eyebrow">New repair</div><h1 class="title">Log a repair</h1><div class="form"><div class="field"><label>Problem / repair</label><input value="Brake pads"></div><div class="field"><label>Odometer</label><input type="number" value="${state.odometer}"></div><div class="field"><label>Cost (NZD)</label><input type="number" value="480"></div><div class="field"><label>Status</label><select><option>Completed</option><option>In progress</option><option>Waiting for parts</option></select></div><div class="field"><label>Notes</label><textarea rows="3">Front brake pads replaced</textarea></div><button class="btn" onclick="toast('Repair saved');setTimeout(repair,450)">Save repair</button></div>`}
function reminders(){screen.innerHTML=`<div class="back" onclick="go('home')">‹ Back</div><div class="eyebrow">Reminders</div><h1 class="title">Upcoming</h1><div class="row"><div class="row-left"><div class="mini">🔧</div><div><b>Regular service</b><small>Due at 143,550 km</small></div></div><span class="pill">1,200 km</span></div><div class="row"><div class="row-left"><div class="mini">📋</div><div><b>WOF</b><small>Expires 14 Dec 2026</small></div></div><span class="pill warn">82 days</span></div><div class="row"><div class="row-left"><div class="mini">🛞</div><div><b>Tyre inspection</b><small>Due at 144,350 km</small></div></div><span class="pill">2,000 km</span></div>`}
function costs(){screen.innerHTML=`<div class="eyebrow">Running costs</div><h1 class="title">Vehicle costs</h1><div class="vehicle-card"><div class="eyebrow" style="color:#ffffffaa">2026 total</div><div class="cost">$6,920</div><div class="vehicle-meta">$0.31 per kilometre</div></div><div class="section-head"><h3>Cost breakdown</h3></div><div class="row"><div class="row-left"><div class="mini">⛽</div><div><b>Fuel</b><small>69.7% of total</small></div></div><b>$4,820</b></div><div class="row"><div class="row-left"><div class="mini">🔧</div><div><b>Maintenance</b><small>17.9% of total</small></div></div><b>$1,240</b></div><div class="row"><div class="row-left"><div class="mini">🛠️</div><div><b>Repairs</b><small>12.4% of total</small></div></div><b>$860</b></div><div class="section-head"><h3>Monthly trend</h3></div><div class="chart"><div class="bar" style="height:42%"></div><div class="bar" style="height:58%"></div><div class="bar" style="height:47%"></div><div class="bar" style="height:65%"></div><div class="bar" style="height:74%"></div><div class="bar" style="height:82%"></div></div>`}
function tracking(){screen.innerHTML=`<div class="back" onclick="vehicle()">‹ Back</div><div class="eyebrow">Vehicle movement</div><h1 class="title">Trips</h1><div class="tile"><div class="emoji">📍</div><b>Tracking active</b><span>Last update 4 minutes ago</span><div style="margin-top:15px;background:var(--surface);border-radius:14px;height:145px;display:grid;place-items:center;font-size:42px">🗺️</div></div><div class="section-head"><h3>Recent trips</h3></div><div class="row"><div class="row-left"><div class="mini">→</div><div><b>Work → Home</b><small>18.4 km • 27 min</small></div></div><span class="pill">Today</span></div><div class="row"><div class="row-left"><div class="mini">→</div><div><b>Home → Work</b><small>21.1 km • 31 min</small></div></div><span class="pill">Today</span></div>`}
function more(){screen.innerHTML=`<div class="eyebrow">Settings</div><h1 class="title">More</h1><div class="row"><div class="row-left"><div class="mini">👤</div><div><b>Drivers</b><small>Manage driver access</small></div></div><span>›</span></div><div class="row"><div class="row-left"><div class="mini">📄</div><div><b>Documents</b><small>Invoices, WOF & service records</small></div></div><span>›</span></div><div class="row"><div class="row-left"><div class="mini">⚙️</div><div><b>App settings</b><small>Notifications & preferences</small></div></div><span>›</span></div><div class="row"><div class="row-left"><div class="mini">🏢</div><div><b>Fleet mode</b><small>Coming in Version 2</small></div></div><span class="pill">Soon</span></div>`}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
go('home');
</script></body></html>
